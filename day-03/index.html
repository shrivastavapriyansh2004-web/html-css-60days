<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 3 - Links & Images</title>
  </head>
  <body>
    <h1>Links and Images practice</h1>

    <!-- External Link -->
    <p>
      Visit Google:
      <a href="https://www.google.com" target="_blank"
        >Click here to go to Google</a
      >
    </p>

    <!-- Internal Link (same page)-->
    <p>
      <a href="#bottom">Go to Bottom of the Page</a>
    </p>

    <!-- Image -->
    <h2>My Image</h2>
    <img
      src="https://picsum.photos/300/200"
      alt="Random practice image"
      width="300"
    />

    <p>The image above is loaded from the internet.</p>

    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />

    <h2 id="bottom">You reached the bottom!</h2>
    <p><a href="#">Go back to the top</a></p>
  </body>
</html>
