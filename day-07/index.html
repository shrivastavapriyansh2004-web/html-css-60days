<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 7 - Forms Part 2</title>
  </head>
  <body>
    <h1>Day 7 - More Form Elements</h1>

    <form>
      <!-- Radio Buttons -->
      <h3>Select your gender:</h3>
      <input type="radio" id="male" name="gender" value="male" />
      <label for="male">Male</label><br />

      <input type="radio" id="female" name="gender" value="female" />
      <label for="female">Female</label><br />

      <input type="radio" id="other" name="gender" value="other" />
      <label for="other">Other</label>

      <br /><br />

      <!-- Checkboxes -->
      <h3>Select your hobbies:</h3>
      <input type="checkbox" id="coding" name="hobby" value="coding" />
      <label for="coding">Coding</label><br />

      <input type="checkbox" id="reading" name="hobby" value="reading" />
      <label for="reading">Reading</label><br />

      <input type="checkbox" id="sports" name="hobby" value="sports" />
      <label for="sports">Sports</label><br />

      <input type="checkbox" id="music" name="hobby" value="music" />
      <label for="music">Music</label>

      <br /><br />

      <!-- Dropdown (Select) -->
      <h3>Select your country:</h3>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="">-- Select Country --</option>
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
        <option value="canada">Canada</option>
        <option value="australia">Australia</option>
      </select>

      <br /><br />

      <!-- Textarea -->
      <h3>Write something about yourself:</h3>
      <label for="about">About Me:</label><br />
      <textarea
        id="about"
        name="about"
        rows="5"
        cols="40"
        placeholder="Write a short bio..."
      ></textarea>

      <br /><br />

      <!-- Submit Button -->
      <button type="submit">Submit Form</button>
    </form>
  </body>
</html>
